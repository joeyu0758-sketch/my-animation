<!DOCTYPE html>
<html>
<head>
<style>
  body { display:flex; justify-content:center; align-items:center; height:100vh; background:#111; }
  .ball { width:60px; height:60px; border-radius:50%; background:#ff5a36;
          animation: bounce 1s ease-in-out infinite alternate; }
  @keyframes bounce { from { transform:translateY(-150px); } to { transform:translateY(150px); } }
</style>
</head>
<body><div class="ball"></div></body>
</html>
